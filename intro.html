    <script type="text/javascript">
      genMenu();
      var myPlayer = videojs('example_video_1');
      
      $('#btn_volume_icon').click(function () {
            var btn = $(this)
            var active =btn.hasClass('active');
            if(active)//muted
            {
              
              var icon = document.getElementById("span_volume_icon")
              icon.className = "icon-volume-up" ;
              myPlayer.muted(false);
            }
            else //unmuted
            {
              
              var icon = document.getElementById("span_volume_icon")
              icon.className = "icon-volume-off" ;
              myPlayer.muted(true);
            }
          })
         
      $('#btn_pause_icon').click(function () {
            var btn = $(this)
            var active =btn.hasClass('active');
            if(active)//pause
            {
              
              var icon = document.getElementById("span_pause_icon")
              icon.className = "icon-pause" ;
              myPlayer.play();
            }
            else //play
            {
              
              var icon = document.getElementById("span_pause_icon")
              icon.className = "icon-play" ;
              myPlayer.pause();
            }
          })
      
      $('#btn_skip_icon').click(function () {
            window.location.assign("index.html");
          })

      myPlayer.ready(function(){
          

          // EXAMPLE: Start playing the video.
          myPlayer.play();
          myPlayer.muted(true);
          myPlayer.volume(0.1); 
          // myPlayer.controls(true);
          try{
          myPlayer.enableTouchActivity();}
          catch(e){

          }
          myPlayer.on("ended",function(){
            myPlayer.play();
          })
        });
    </script>
